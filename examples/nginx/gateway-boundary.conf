# Redacted example — gateway as boundary layer.
#
# The gateway is not only a routing component: it sets security headers,
# propagates request/trace correlation into the internal services and blocks
# internal route patterns from external access.
#
# Redacted: concrete route patterns, internal service names, rate limits.

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# External API traffic is proxied to internal services with correlation
# context preserved across the service boundary.
location /api/example/ {
    proxy_pass http://internal-example-service/;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Internal route patterns are not reachable from outside — the gateway is
# the only intended entry point.
location ~ ^/(internal|metrics|admin-internal)/ {
    return 403;
}
